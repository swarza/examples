<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static site on swarza</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <main>
      <h1>Hello from swarza</h1>
      <p>
        This page is a plain HTML file. swarza serves it from its CDN, with the headers in
        <code>swarza.json</code>.
      </p>
      <ul>
        <li><a href="/old/">/old/</a> redirects here (301).</li>
        <li><a href="/missing">/missing</a> shows <code>404.html</code> with status 404.</li>
      </ul>
    </main>
  </body>
</html>
